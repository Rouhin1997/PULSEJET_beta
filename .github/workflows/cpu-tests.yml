name: CPU candidate tests

on:
  push:
    branches:
      - dev/polynomial-search
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  candidate-distillation:
    name: Standalone C++17 candidate tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Run CPU candidate tests
        run: bash tests/run_cpu_tests.sh
