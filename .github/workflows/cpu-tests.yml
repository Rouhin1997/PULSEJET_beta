name: CPU candidate tests

on:
  push:
    branches:
      - dev/polynomial-search
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  candidate-distillation:
    name: Standalone C++17 candidate tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Run CPU candidate and polynomial timing tests
        run: bash tests/run_cpu_tests.sh
      - name: Test polynomial XML to PulsarX conversion
        run: python3 -m unittest discover -s tests -p test_xml_to_pulsarx.py -v
      - name: Verify polynomial source/container wiring
        run: python3 tests/test_polynomial_wiring.py
      - name: Check CUDA Makefile dependency graph without building
        run: make -n all | grep -F nvcc
