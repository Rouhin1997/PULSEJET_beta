name: build-pulsejet-development-image

# Development image builds are requested by editing the marker file.
# The workflow can also be manually dispatched once registered on GitHub's
# default branch. Push-trigger works without adding anything to master.
on:
  workflow_dispatch:
  push:
    branches:
      - dev/polynomial-search
    paths:
      - ci/build-dev-request.txt

permissions:
  contents: read

jobs:
  docker-build-development:
    if: github.ref == 'refs/heads/dev/polynomial-search'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout development commit
        uses: actions/checkout@v4
      - name: Record source revision
        run: |
          echo "Source revision: $(git rev-parse HEAD)"
          test "$GITHUB_REF" = "refs/heads/dev/polynomial-search"
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build and publish versioned development image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            docker.io/${{ secrets.DOCKERHUB_USERNAME }}/pulsejet:dev-polynomial-${{ github.sha }}
            docker.io/${{ secrets.DOCKERHUB_USERNAME }}/pulsejet:dev-polynomial-latest
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=https://github.com/Rouhin1997/PULSEJET_beta
